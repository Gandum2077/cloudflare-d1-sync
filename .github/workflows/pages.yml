name: Deploy guide to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        env:
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: |
          mkdir _site
          cp docs/index.html docs/style.css docs/app.js docs/API.md _site/
          node -e 'const fs=require("fs"); const p="_site/index.html"; const s=fs.readFileSync(p,"utf8").replaceAll("__REPOSITORY_URL__",process.env.REPOSITORY_URL); fs.writeFileSync(p,s);'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
